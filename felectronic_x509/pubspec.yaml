name: felectronic_x509
description: >-
  Pure Dart X.509 certificate parser. Extracts subject, issuer, validity,
  key usage, extensions, and more from DER-encoded bytes.
version: 1.0.0
repository: https://github.com/Crdzbird/spanishgov_toolkits
issue_tracker: https://github.com/Crdzbird/spanishgov_toolkits/issues
topics:
  - x509
  - certificate
  - asn1
  - der
  - parser

environment:
  sdk: ^3.5.0

# Part of the pub workspace declared in the repository root pubspec.yaml.
resolution: workspace

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
