name: felectronic_x509

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/felectronic_x509.yaml"
      - "pubspec.yaml"
      - "felectronic_x509/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/felectronic_x509.yaml"
      - "pubspec.yaml"
      - "felectronic_x509/**"

jobs:
  build:
    # felectronic_x509 has no Flutter dependency of its own, but it is a
    # member of the pub workspace, so resolving it pulls in the Flutter
    # packages and requires the Flutter SDK. dart_package.yml exposes no
    # Flutter inputs, hence the Flutter workflow.
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.47.0
      working_directory: felectronic_x509
      # Ratchet at the current measured level so CI is green today and
      # coverage cannot regress. Raise as tests are added; the workflow
      # default is 100.
      min_coverage: 35
