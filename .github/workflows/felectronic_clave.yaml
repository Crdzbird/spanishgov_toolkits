name: felectronic_clave

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/felectronic_clave.yaml"
      - "pubspec.yaml"
      - "felectronic_clave/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/felectronic_clave.yaml"
      - "pubspec.yaml"
      - "felectronic_clave/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.1
      working_directory: felectronic_clave
      # Ratchet at the current measured level so CI is green today and
      # coverage cannot regress. Raise as tests are added; the workflow
      # default is 100.
      min_coverage: 18
