name: felectronic_dnie

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/felectronic_dnie.yaml"
      - "pubspec.yaml"
      - "felectronic_dnie/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/felectronic_dnie.yaml"
      - "pubspec.yaml"
      - "felectronic_dnie/**"

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.47.0
      working_directory: felectronic_dnie
      # Ratchet at the level CI measures; raise as tests are added.
      min_coverage: 15


  # End-to-end runs on Android only.
  #
  # felectronic_dnie declares android and ios platforms, and the example app
  # has only those two platform folders — the linux/macos/web/windows jobs
  # that used to live here tested platforms this plugin does not support and
  # the example cannot build for.
  #
  # The ios job is removed for a different reason: felectronic_dnie_ios does
  # not link yet (the j2objc runtime, libjre_emul.a, is not vendored in this
  # repository), so an iOS end-to-end run cannot pass. Restore it once that
  # is resolved.
  android:
    # ubuntu-latest, not macos-latest: reactivecircus/android-emulator-runner
    # needs hardware acceleration, and GitHub's macOS runners are now ARM,
    # where the emulator images it uses do not run. Ubuntu provides KVM.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: felectronic_dnie/example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Java 17: current Android Gradle Plugin versions reject Java 11.
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match the rest of CI and local development.
          flutter-version: 3.47.0

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: fluttium test flows/app_launches.yaml -d android
          working-directory: felectronic_dnie/example
