name: felectronic_dnie

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/felectronic_dnie.yaml"
      - "pubspec.yaml"
      - "felectronic_dnie/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/felectronic_dnie.yaml"
      - "pubspec.yaml"
      - "felectronic_dnie/**"

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.47.0
      working_directory: felectronic_dnie
      # Ratchet at the level CI measures; raise as tests are added.
      min_coverage: 15


  # End-to-end runs on Android only, via Flutter's integration_test.
  #
  # Fluttium was dropped: its latest release is 0.1.0 and its test driver
  # fails to start against Flutter 3.47 ("Failed to start test driver").
  # integration_test is Flutter's own, maintained equivalent and its
  # dependencies were already in the example's pubspec.
  #
  # felectronic_dnie declares android and ios platforms, and the example app
  # has only those two platform folders — the linux/macos/web/windows jobs
  # that used to live here tested platforms this plugin does not support and
  # the example cannot build for.
  #
  # The ios job is removed for a different reason: felectronic_dnie_ios does
  # not link yet (the j2objc runtime, libjre_emul.a, is not vendored in this
  # repository), so an iOS end-to-end run cannot pass. Restore it once that
  # is resolved.
  android:
    # ubuntu-latest, not macos-latest: reactivecircus/android-emulator-runner
    # needs hardware acceleration, and GitHub's macOS runners are now ARM,
    # where the emulator images it uses do not run. Ubuntu provides KVM.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: felectronic_dnie/example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Java 17: current Android Gradle Plugin versions reject Java 11.
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match the rest of CI and local development.
          flutter-version: 3.47.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      - name: Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 29 defaults to an x86 image, which Flutter reports as
          # "unsupported" — it dropped 32-bit x86 Android support, so
          # `flutter test` saw the emulator and refused it with "No devices
          # are connected". x86_64 on a current API level is supported.
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # The emulator-runner reports boot complete before adb always has
            # the device registered, and Flutter's device discovery then finds
            # nothing ("No devices are connected"). Wait for adb explicitly and
            # print what Flutter can see, so a failure here is diagnosable
            # rather than opaque.
            adb wait-for-device
            adb devices
            flutter devices
            flutter test integration_test
          working-directory: felectronic_dnie/example
