name: spell_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/cspell.json"
      - ".github/workflows/spell_check.yaml"
  push:
    branches:
      - master
    paths:
      - "**/*.md"
      - ".github/cspell.json"
      - ".github/workflows/spell_check.yaml"

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false
