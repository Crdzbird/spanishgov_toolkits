name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
    paths:
      - "felectronic_dnie/pubspec.yaml"
      - "felectronic_dnie_platform_interface/pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - master
    paths:
      - "felectronic_dnie/pubspec.yaml"
      - "felectronic_dnie_platform_interface/pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      flutter_version: 3.47.0
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: felectronic_dnie

  license_check_platform_interface:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      flutter_version: 3.47.0
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: felectronic_dnie_platform_interface
