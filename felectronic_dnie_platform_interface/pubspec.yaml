name: felectronic_dnie_platform_interface
description: >-
  A common platform interface for the felectronic_dnie plugin.
  Defines the shared API for Android and iOS DNIe NFC implementations.
version: 1.0.0
repository: https://github.com/Crdzbird/spanishgov_toolkits
issue_tracker: https://github.com/Crdzbird/spanishgov_toolkits/issues
topics:
  - nfc
  - dnie
  - platform-interface

environment:
  flutter: ">=3.22.0"
  sdk: ^3.11.0

# Part of the pub workspace declared in the repository root pubspec.yaml.
resolution: workspace

dependencies:
  felectronic_x509: ^1.0.0
  flutter:
    sdk: flutter
  meta: ^1.7.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^26.3.3
  very_good_analysis: ^10.2.0
