description: The example app launches and renders its main screen
---
# A launch smoke test. The plugin's real functionality (DNIe over NFC,
# certificate signing) needs physical hardware and a card, so it cannot be
# exercised in CI — but a regression that stops the app booting, or breaks
# plugin registration, shows up here.
#
# Replaces the `very_good create flutter_plugin` scaffolding flow, which
# pressed a "Get Platform Name" button that no longer exists anywhere in this
# repository.
- expectVisible: "Felectronic Suite"
- expectVisible: "Basic Operations"
