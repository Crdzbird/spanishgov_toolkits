name: felectronic_dnie_example
description: Demonstrates how to use the felectronic_dnie plugin suite.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

# Part of the pub workspace declared in the repository root pubspec.yaml.
resolution: workspace

dependencies:
  felectronic_certificates: ^1.0.0
  felectronic_clave: ^1.0.0
  felectronic_dnie: ^1.0.0
  # Example-only: lets the demo pick a PKCS#12 from the device so a
  # certificate can actually be imported into the app's keychain.
  file_picker: ^8.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  # The iOS plugin mixes the j2objc Objective-C tree with Swift, which Swift
  # Package Manager refuses to build, so this app stays on CocoaPods.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/test.p12
